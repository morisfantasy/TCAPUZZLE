// The pieces in the DOM always represent the destination position. Any transitory
// captured or promoting piece lives only for the duration of its animation.
const BoardMotion = (() => {
  const active = new WeakMap();
  const cellAt = (board,sq) => board.querySelector('[data-square="'+sq+'"],[data-sq="'+sq+'"]');
  function snapshot(board) {
    const pieces = new Map();
    for (const svg of board.querySelectorAll('.study-piece > svg,.pc > svg')) {
      const cell = svg.closest('[data-square],[data-sq]');
      if (cell && !svg.closest('.motion-ghost')) pieces.set(cell.dataset.square || cell.dataset.sq, svg.dataset.man);
    }
    return pieces;
  }
  function cancel(board) {
    for (const animation of active.get(board) || []) animation.cancel();
    active.delete(board);
    board.querySelectorAll('.motion-ghost').forEach(el=>el.remove());
  }
  function play(board, before, move, reverse=false, dragged=false) {
    if (!before || !move || !Element.prototype.animate || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const animations = [], duration = 150, after = snapshot(board);
    active.set(board,animations);
    const start = reverse ? move.to : move.from, end = reverse ? move.from : move.to;
    const source = before.get(start);
    if (!source || !after.has(end)) return;
    function run(el, frames, cleanup=()=>{}) {
      const animation=el.animate(frames,{duration,easing:'cubic-bezier(.23,.7,.27,1)'});
      animations.push(animation);
      animation.onfinish=animation.oncancel=cleanup;
    }
    function ghost(sq,code) {
      const cell=cellAt(board,sq), el=document.createElement('span');
      el.className=(cell.hasAttribute('data-sq')?'pc':'study-piece')+' motion-ghost';
      el.setAttribute('aria-hidden','true'); el.innerHTML=pieceSVG(code);cell.append(el);return el;
    }
    const movers=[[start,end]];
    if(source.toLowerCase()==='k' && Math.abs(move.from.charCodeAt(0)-move.to.charCodeAt(0))===2) {
      const kingSide=move.to[0]==='g', rank=move.from[1], rook=[(kingSide?'h':'a')+rank,(kingSide?'f':'d')+rank];
      movers.push(reverse?rook.reverse():rook);
    }
    for (const [from,to] of movers) {
      const cell=cellAt(board,to), piece=cell?.querySelector('.study-piece,.pc');
      if (!piece || (dragged && from===start)) continue;
      const a=cellAt(board,from).getBoundingClientRect(), b=cell.getBoundingClientRect();
      const translate='translate('+(a.left-b.left)+'px,'+(a.top-b.top)+'px)';
      const promoting=before.get(from)!==after.get(to);
      if (promoting) {
        const pawn=ghost(to,before.get(from));
        run(pawn,[{transform:translate,opacity:1,zIndex:7},{transform:'none',opacity:1,zIndex:7,offset:.82},{opacity:0,zIndex:7}],()=>pawn.remove());
        run(piece,[{opacity:0},{opacity:0,offset:.8},{opacity:1}]);
      } else run(piece,[{transform:translate,zIndex:7},{transform:'none',zIndex:7}]);
    }
    const movingSources=new Set(movers.map(m=>m[0])), movingTargets=new Set(movers.map(m=>m[1]));
    for (const [sq,code] of before) {
      if (movingSources.has(sq) || after.get(sq)===code) continue;
      const captured=ghost(sq,code);
      run(captured,[{opacity:.85},{opacity:0,offset:.85},{opacity:0}],()=>captured.remove());
    }
    for (const [sq,code] of after) {
      if (!movingTargets.has(sq) && before.get(sq)!==code) {
        const el=cellAt(board,sq).querySelector('.study-piece,.pc');
        run(el,[{opacity:0},{opacity:1}]);
      }
    }
  }
  return {snapshot,cancel,play};
})();

function boardHtml(ex,interactive=true,sel=[],visualMove=null){
  const n=ex.size||8, files='abcdefghi'.slice(0,n), base=ex.size===9?(ex.pieces||{}):parseFen(ex.fen), selected=new Set(sel);
  let map=base;
  if(visualMove && n===8 && ex.fen) {
    const game=new MiniChess.Game(ex.fen);
    const promo={queen:'q',rook:'r',bishop:'b',knight:'n'}[visualMove.promo];
    const played=game.move({from:visualMove.from,to:visualMove.to,promo});
    if(played) {
      map=parseFen(game.fen());
      if(played.promo && !promo)map[visualMove.to]=base[visualMove.from];
    }
  }
  let h='<div class="wb-board '+(ex.reversedColors?'reversed':'')+'" style="--n:'+n+'">';
  for(let row=n;row>=1;row--)for(let fi=0;fi<n;fi++){
    const sq=files[fi]+row, p=map[sq], dark=((fi+row)%2===1);
    h+='<button type="button" class="wb-sq '+(dark?'d ':'')+(selected.has(sq)?'sel ':'')+((ex.markers||[]).includes(sq)?'marked ':'')+'" data-sq="'+sq+'" '+(!interactive?'tabindex="-1"':'')+'>'+
      (p?'<span class="pc">'+pieceSVG(p)+'</span>':'')+
      (row===1?'<span class="coord file">'+files[fi]+'</span>':'')+(fi===0?'<span class="coord rank">'+row+'</span>':'')+'</button>';
  }
  return h+'</div>';
}
function normalizeMove(s){

  return m?{from:m[1],to:m[2],promo:m[3]||''}:null;
}

function legalMovesFrom(ex,from){
  if(!ex?.fen || ex.size===9 || !from || typeof MiniChess==='undefined') return [];
  try{
    const g=new MiniChess.Game(ex.fen);
    return g.moves().filter(m=>MiniChess.sqName(m.from)===from).map(m=>({
      from:MiniChess.sqName(m.from),to:MiniChess.sqName(m.to),promo:m.promo||'',capture:!!m.captured
    }));

}

  const ch=BOOK.ch[ex.ci], copy=bookCopy(ex.ci), pg=ch.practice[ex.pi], prev=BY_ID[id-1], next=BY_ID[id+1];
  const state={selected:new Set(),from:null,to:null,promo:null,guard:null,special:null,choice:null,revealed:false,legalMoves:[]};
  root.innerHTML=shell('<nav class="crumbs"><a href="#/library">'+esc(t('myBooks'))+'</a><span class="sep">/</span><a href="#/book/1">White Pawn</a><span class="sep">/</span><a href="#/book/1/ch/'+ex.ci+'">'+esc(copy.title)+'</a></nav>'+
    '<div class="wp-play"><div class="wp-board-col"><div id="exerciseBoard">'+boardHtml(ex,true)+'</div><div class="wp-book-page">'+esc(t('page'))+' '+pg.page+' · '+esc(t('exercise'))+' '+String(ex.id).padStart(3,'0')+'</div></div>'+
    '<aside class="card wp-task"><div class="wp-task-top"><span class="count">'+esc(t('exercise'))+' '+String(ex.id).padStart(3,'0')+'</span><span class="badge">'+esc(bookLabel(ex.label||''))+'</span></div>'+
    '<h2>'+esc(copy.title)+'</h2><p class="wp-instruction">'+esc(bookInstruction(ex.ci,ex.pi))+'</p>'+(isFirstExerciseInSubchapter(ex)?'<button type="button" class="tutorial-launch" id="openTutorial"><span class="playdot">▶</span>'+esc((TUTORIAL_COPY[lang]||TUTORIAL_COPY.en).button)+'</button>':'')+'<div class="wp-help" id="help"></div><div id="controls"></div><div id="feedback"></div>'+
    '<div class="wp-task-actions"><button class="btn white sm" id="resetEx">'+esc(t('reset'))+'</button><button class="btn ghost sm" id="showAnswer">'+esc(t('show'))+'</button></div>'+
    '<p class="wp-source-note">'+esc(t('sourceNote'))+'</p><div class="wp-nav">'+(prev?'<a class="btn ghost sm" href="#/play/'+prev.id+'">‹ '+esc(t('previous'))+'</a>':'<span></span>')+
    (next?'<a class="btn ghost sm" href="#/play/'+next.id+'">'+esc(t('next'))+' ›</a>':'<a class="btn ghost sm" href="#/book/1/ch/'+ex.ci+'">'+esc(t('chapterOverview'))+'</a>')+'</div></aside></div>');
  bindShell();

  const boardWrap=$('#exerciseBoard'), controls=$('#controls'), help=$('#help'), fb=$('#feedback');
  const tutBtn=$('#openTutorial'); if(tutBtn)tutBtn.onclick=()=>openTutorial(ex);
  let displayedMove=null;
  function paintBoard(dragged=false){
    const visual=(ex.type==='move'||ex.type==='moveguard')&&state.from&&state.to?{from:state.from,to:state.to,promo:state.promo}:null;
    BoardMotion.cancel(boardWrap);
    const edge=visual && !displayedMove?visual:!visual && displayedMove?displayedMove:null;
    const before=edge?BoardMotion.snapshot(boardWrap):null;
    boardWrap.innerHTML=boardHtml(ex,true,[...state.selected],visual);
    if(edge) BoardMotion.play(boardWrap,before,edge,!visual,dragged);
    displayedMove=visual;
    bindBoard();
    if((ex.type==='move'||ex.type==='moveguard')&&state.from&&!state.to) showMoveHints();
  }
  function clearMoveHints(){
    $$('.move-dot',boardWrap).forEach(x=>x.remove());
    $$('.wb-sq',boardWrap).forEach(x=>x.classList.remove('move-source'));
  }
  function showMoveHints(){
    clearMoveHints();
    if(!state.from||state.to)return;
    const src=$('.wb-sq[data-sq="'+state.from+'"]',boardWrap); if(src)src.classList.add('move-source');
    state.legalMoves.forEach(m=>{
      const cell=$('.wb-sq[data-sq="'+m.to+'"]',boardWrap); if(!cell)return;
      const dot=document.createElement('span');dot.className='move-dot'+(m.capture?' capture':'');cell.appendChild(dot);
    });
  }
  function selectMoveSource(sq){
    const moves=legalMovesFrom(ex,sq);
    state.from=sq;state.to=null;state.guard=null;state.promo=null;state.legalMoves=moves;state.selected=new Set([sq]);
    help.textContent=t('selectMove');
    showMoveHints();
    renderControls();
  }
  function completeMove(from,to,dragged=false){
    const lm=state.legalMoves.find(m=>m.from===from&&m.to===to);
    if(!lm)return false;
    state.from=from;state.to=to;state.guard=null;state.promo=lm.promo?null:state.promo;state.legalMoves=[];state.selected=new Set([to]);
    if(ex.type==='moveguard')help.textContent=t('selectGuard'); else help.textContent='';
    paintBoard(dragged);renderControls();rebindDirect();
    return true;
  }
  function bindMoveBoard(){
    const board=$('.wb-board',boardWrap); if(board)board.classList.add('move-enabled');
    const original=parseFen(ex.fen);
    $$('.wb-sq',boardWrap).forEach(cell=>{
      const sq=cell.dataset.sq;
      cell.onclick=e=>{
        if(ex.type==='moveguard'&&state.to&&!state.guard){
          state.guard=sq;state.selected.add(sq);paintBoard();return;
        }
        if(state.to)return;
        if(state.from && completeMove(state.from,sq))return;
        if(original[sq]){
          selectMoveSource(sq);
          state.selected=new Set([sq]);
          $$('.wb-sq',boardWrap).forEach(x=>x.classList.toggle('sel',x.dataset.sq===sq));
        }
      };
      cell.onpointerdown=e=>{
        if(ex.type==='moveguard'&&state.to)return;
        if(state.to)return;
        if(!original[sq] || state.legalMoves.some(m=>m.to===sq))return;
        const moves=legalMovesFrom(ex,sq); if(!moves.length)return;
        state.from=sq;state.to=null;state.guard=null;state.promo=null;state.legalMoves=moves;state.selected=new Set([sq]);
        showMoveHints();
        const sx=e.clientX,sy=e.clientY;let dragging=false,ghost=null;
        const pc=$('.pc',cell),rect=cell.getBoundingClientRect();
        const move=ev=>{
          if(!dragging&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>7){
            dragging=true;
            ghost=document.createElement('div');ghost.className='piece-drag-ghost';ghost.innerHTML=pc?pc.innerHTML:'';
            ghost.style.width=rect.width+'px';ghost.style.height=rect.height+'px';document.body.appendChild(ghost);
            cell.classList.add('drag-origin');
          }
          if(ghost){ghost.style.left=(ev.clientX-rect.width/2)+'px';ghost.style.top=(ev.clientY-rect.height/2)+'px';}
        };
        const up=ev=>{
          document.removeEventListener('pointermove',move,true);document.removeEventListener('pointerup',up,true);document.removeEventListener('pointercancel',up,true);
          if(ghost)ghost.remove();cell.classList.remove('drag-origin');
          if(ev.type==='pointercancel')return;
          if(dragging){
            const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest?.('.wb-sq');
            if(target&&completeMove(sq,target.dataset.sq,true)){e.preventDefault();return;}
            showMoveHints();
          }else{
            state.from=sq;state.legalMoves=moves;state.selected=new Set([sq]);showMoveHints();renderControls();
          }
        };
        document.addEventListener('pointermove',move,true);document.addEventListener('pointerup',up,true);document.addEventListener('pointercancel',up,true);
      };
    });
  }
  function bindBoard(){
    if(ex.type==='move'||ex.type==='moveguard'){bindMoveBoard();return;}
    $$('.wb-sq',boardWrap).forEach(s=>s.onclick=()=>{
      const sq=s.dataset.sq;
      if(ex.type==='select' || (ex.type==='setup' && ex.accepted?.mode==='squares')){
        state.selected.has(sq)?state.selected.delete(sq):state.selected.add(sq); paintBoard();
      }
    });
  }
  function renderControls(){
    let h='';
    if(ex.type==='square'){
      h='<div class="field"><label>'+esc(t('square'))+'</label><input id="squareInput" maxlength="2" placeholder="e4" autocomplete="off"></div>';
    }else if(ex.type==='yesno'){
      h='<div class="wp-choice-row"><button class="btn white" data-choice="yes">'+esc(t('yes'))+'</button><button class="btn white" data-choice="no">'+esc(t('no'))+'</button></div>';
    }else if(ex.type==='choice4'){
      h='<div class="wp-choice-grid"><button class="btn white" data-choice="check">'+esc(t('checkLabel'))+'</button><button class="btn white" data-choice="checkmate">'+esc(t('mate'))+'</button><button class="btn white" data-choice="stalemate">'+esc(t('stalemate'))+'</button><button class="btn white" data-choice="none">'+esc(t('none'))+'</button></div>';
    }else if(ex.type==='castle'){
      h='<div class="wp-choice-grid"><button class="btn white" data-toggle="kingside">'+esc(t('kingside'))+'</button><button class="btn white" data-toggle="queenside">'+esc(t('queenside'))+'</button><button class="btn white" data-special="neither">'+esc(t('neither'))+'</button></div>';
    }else if(ex.type==='ab'){
      h='<div class="wp-choice-grid"><button class="btn white" data-choice="A">A · '+esc(ex.options?.A||'')+'</button><button class="btn white" data-choice="B">B · '+esc(ex.options?.B||'')+'</button></div>';
    }else if(ex.type==='setup' && ex.accepted?.mode!=='squares'){
      h='<div class="wp-choice-grid"><button class="btn white" data-special="ok">'+esc(t('ok'))+'</button><button class="btn white" data-special="colors">'+esc(t('colors'))+'</button><button class="btn white" data-special="size">'+esc(t('size'))+'</button></div>';
    }
    const mv=normalizeMove(ex.canonicalMove);
    if((ex.type==='move'||ex.type==='moveguard') && mv?.promo && state.to){
      h+='<div class="mini-label" style="margin-top:12px">'+esc(t('promotion'))+'</div><div class="wp-choice-row">'+['queen','rook','bishop','knight'].map(p=>'<button class="btn white sm" data-promo="'+p+'">'+p[0].toUpperCase()+'</button>').join('')+'</div>';
    }
    if(['select','setup','move','moveguard','square','castle'].includes(ex.type)) h+='<button class="btn block" id="checkEx" style="margin-top:14px">'+esc(t('check'))+'</button>';
    controls.innerHTML=h;
    $$('[data-choice]',controls).forEach(b=>b.onclick=()=>{state.choice=b.dataset.choice;$$('[data-choice]',controls).forEach(x=>x.classList.toggle('mint',x===b));});
    $$('[data-toggle]',controls).forEach(b=>b.onclick=()=>{const x=b.dataset.toggle;state.selected.has(x)?state.selected.delete(x):state.selected.add(x);b.classList.toggle('mint',state.selected.has(x));});
    $$('[data-special]',controls).forEach(b=>b.onclick=()=>{state.special=b.dataset.special;$$('[data-special]',controls).forEach(x=>x.classList.toggle('mint',x===b));});
    $$('[data-promo]',controls).forEach(b=>b.onclick=()=>{state.promo=b.dataset.promo;paintBoard();$$('[data-promo]',controls).forEach(x=>x.classList.toggle('mint',x===b));});
    const chk=$('#checkEx'); if(chk)chk.onclick=checkAnswer;
  }
  function result(ok,neutral=false){
    if(ok){ mark(keyOf(ex.id),'c'); fb.innerHTML='<div class="wp-feedback ok"><b>'+esc(t('correct'))+'</b><p>'+esc(localizeAnswer(ex.answer,ex))+'</p></div>'; }
    else if(neutral){ fb.innerHTML='<div class="wp-feedback info"><b>'+esc(t('answer'))+'</b><p>'+esc(t('notExample'))+'</p><p><strong>'+esc(localizeAnswer(ex.answer,ex))+'</strong></p></div>'; }
    else{ mark(keyOf(ex.id),'w'); fb.innerHTML='<div class="wp-feedback bad"><b>'+esc(t('tryAgain'))+'</b></div>'; }
  }
  function checkAnswer(){
    if(ex.type==='square'){
      const v=($('#squareInput')?.value||'').trim().toLowerCase(); result((ex.accepted||[]).map(x=>x.toLowerCase()).includes(v)); return;
    }
    if(ex.type==='select'){ result(sameSet(state.selected,new Set(ex.accepted||[]))); return; }
    if(ex.type==='setup'){
      if(ex.accepted?.mode==='squares') result(sameSet(state.selected,new Set(ex.accepted.squares||[])));
      else result(state.special===ex.accepted?.mode);
      return;
    }
    if(ex.type==='castle'){
      const wanted=new Set(ex.accepted||[]); const got=state.special==='neither'?new Set():new Set([...state.selected].filter(x=>x==='kingside'||x==='queenside'));
      result(sameSet(got,wanted)); return;
    }
    if(ex.type==='move'||ex.type==='moveguard'){
      const m=normalizeMove(ex.canonicalMove), exact=m&&state.from===m.from&&state.to===m.to&&(!m.promo||state.promo===m.promo)&&(!ex.guard||state.guard===ex.guard);
      result(!!exact,!exact&&!!state.from&&!!state.to); return;
    }
  }
  $$('[data-choice]',controls).forEach(b=>b.onclick=()=>{state.choice=b.dataset.choice; const ok=String(state.choice).toLowerCase()===String(ex.accepted).toLowerCase(); result(ok);});
  function rebindDirect(){
    $$('[data-choice]',controls).forEach(b=>b.onclick=()=>{state.choice=b.dataset.choice;$$('[data-choice]',controls).forEach(x=>x.classList.toggle('mint',x===b));result(String(state.choice).toLowerCase()===String(ex.accepted).toLowerCase());});
  }
  rebindDirect();
  $('#resetEx').onclick=()=>{state.selected.clear();state.legalMoves=[];state.from=state.to=state.promo=state.guard=state.special=state.choice=null;fb.innerHTML='';paintBoard();renderControls();rebindDirect();};
  $('#showAnswer').onclick=()=>{mark(keyOf(ex.id),'w');fb.innerHTML='<div class="wp-feedback info"><b>'+esc(t('answer'))+'</b><p>'+esc(localizeAnswer(ex.answer,ex))+'</p></div>';};
  help.textContent=(ex.type==='move'||ex.type==='moveguard')?t('selectMove'):ex.type==='select'?t('selectSquares'):'';
  paintBoard(); renderControls(); rebindDirect();

}

function render(){
  ++renderVersion;
  if(unmountStudy){unmountStudy();unmountStudy=null;}
  document.documentElement.lang=({zh:'zh-CN',yue:'zh-HK'})[lang]||lang;
  const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(!Auth.current()&&parts[0]!=='calculator'){ renderAuth(parts[0]==='signup'?'signup':'login'); return; }
  if(!parts[0]||parts[0]==='home')renderHome();
  else if(['courses','videos'].includes(parts[0]))renderCourses();
  else if(parts[0]==='calculator')renderTool(false);
  else if(parts[0]==='analysis'){if(Auth.current()?.isAdmin)renderTool(true);else go('#/home');}
  else if(['library','books'].includes(parts[0]))renderLibrary();
  else if(parts[0]==='book'&&parts[2]==='ch')renderChapter(+parts[3]);
  else if(parts[0]==='book')renderBook();
  else if(parts[0]==='play')renderExercise(+parts[1]);
  else renderHome();
  window.scrollTo({top:0,left:0,behavior:'auto'});
}
if(!location.hash && ['/analysis','/analysis/','/calculator','/calculator/'].includes(location.pathname)) {
  history.replaceState(null,'','/#'+location.pathname.replace(/\/$/,''));
}
window.addEventListener('pageshow', e=>{if(e.persisted)Auth.restore().finally(render);});
Auth.restore().finally(render);
})();</script>
